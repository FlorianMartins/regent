version: 2

updates:
  # Python dependencies — a vulnerable transitive package is a supply-chain issue,
  # and pip-audit only tells us after the fact. dependency-steward assesses these PRs.
  - package-ecosystem: uv # reads pyproject.toml and keeps uv.lock in step
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The actions used by the pipelines. Pinned to a commit SHA (version in a
  # comment): Dependabot bumps both, and a re-pointed tag cannot slip in.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The base image of the control plane.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The images of the local observability stack.
  - package-ecosystem: docker-compose
    directory: "/infra/compose"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(compose)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Terraform providers of the AWS bootstrap.
  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule:
      interval: monthly
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore(terraform)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
