# =============================================================================
# Release — on a `vX.Y.Z` tag: build, attest, sign, publish.
#
# What a consumer gets, and how they can check it (see scripts/verify_release.sh):
#   - the wheel and sdist, with SLSA build provenance (`gh attestation verify`)
#   - the multi-arch container image on GHCR, signed with cosign (keyless, Sigstore)
#     and carrying provenance + SBOM attestations
#   - the SBOM (SPDX JSON) attached to the GitHub release and attested
#   - a VERIFY.md on the release with the exact verification commands
#
# "Keyless" signing means there is no private key to leak: the OIDC identity of
# this workflow run signs, and the Sigstore transparency log records it.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/florianmartins/regent
  PYTHON_DEFAULT: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Python distribution — built once, attested, reused by every later job
  # ---------------------------------------------------------------------------
  dist:
    name: Build & attest the distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: The tag must match the package version
        run: |
          pip install -e . --quiet
          version="$(regent --version | awk '{print $2}')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::package version $version does not match tag $tag (bump regent/__init__.py)"
            exit 1
          fi

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Attest the build provenance of the distribution (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 2. Container image — multi-arch, pushed to GHCR, signed and attested
  # ---------------------------------------------------------------------------
  image:
    name: Build, sign & attest the image
    runs-on: ubuntu-latest
    needs: [dist]
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing and attestations
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags and OCI labels from the git tag)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit attaches its own provenance and SBOM to the image index.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image by digest (keyless)
        # Signing the digest, not the tag: a tag can be moved, a digest cannot.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: SBOM of the pushed image (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the build provenance of the image (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM of the image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json

  # ---------------------------------------------------------------------------
  # 3. GitHub release — artefacts plus the instructions to verify them
  # ---------------------------------------------------------------------------
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: [dist, image]
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/

      - name: Write VERIFY.md
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cat > VERIFY.md <<EOT
          # Verifying release ${GITHUB_REF_NAME}

          Image: \`${IMAGE}@${DIGEST}\`

          ## Signature (cosign, keyless)
          \`\`\`bash
          cosign verify "${IMAGE}@${DIGEST}" \\
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ## Build provenance (SLSA, GitHub attestations)
          \`\`\`bash
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --owner ${GITHUB_REPOSITORY_OWNER}
          gh attestation verify dist/regent_platform-${GITHUB_REF_NAME#v}-py3-none-any.whl --owner ${GITHUB_REPOSITORY_OWNER}
          \`\`\`

          ## SBOM
          \`sbom.spdx.json\` is attached to this release and attested on the image:
          \`\`\`bash
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --owner ${GITHUB_REPOSITORY_OWNER} --predicate-type https://spdx.dev/Document/v2.3
          \`\`\`

          Or run \`scripts/verify_release.sh ${GITHUB_REF_NAME}\` from a checkout.
          EOT

      - name: Create the release
        # The gh CLI ships with the runner: no third-party action holds contents:write.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --notes-file VERIFY.md \
            dist/* sbom/sbom.spdx.json VERIFY.md

  # ---------------------------------------------------------------------------
  # 4. PyPI — trusted publishing (OIDC), no long-lived token anywhere.
  #    One-time setup: create the `pypi` environment in the repository settings
  #    and register this workflow as a trusted publisher on pypi.org.
  # ---------------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
