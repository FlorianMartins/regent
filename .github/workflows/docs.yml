# Documentation site — built with MkDocs (Material) and published to GitHub
# Pages on every push to main. Enable Pages with "GitHub Actions" as the source
# once (Settings → Pages); the workflow does the rest.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Build
        id: build
        run: |
          if [ ! -f mkdocs.yml ]; then
            echo "no mkdocs.yml — skipping"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv sync --locked --extra docs
          mkdocs build --strict
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload the site
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
