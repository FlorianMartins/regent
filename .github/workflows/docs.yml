# Documentation site — built with MkDocs (Material) and published to GitHub
# Pages on every push to main. Enable Pages with "GitHub Actions" as the source
# once (Settings → Pages); the workflow does the rest.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build
        id: build
        run: |
          if [ ! -f mkdocs.yml ]; then
            echo "no mkdocs.yml — skipping"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m pip install --upgrade pip && pip install -e ".[docs]"
          mkdocs build --strict
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload the site
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
