# Nightly live evals — the offline suite proves the pipeline; this proves the
# *model* still behaves on the same cases. Runs only when a key is configured.
# A regression here means a prompt, a skill or the provider's model changed.
name: Regent nightly evals

on:
  schedule:
    - cron: "5 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evals:
    name: Evals against the real provider
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip when no key is configured
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "no ANTHROPIC_API_KEY secret — live evals skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.gate.outputs.enabled == 'true'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Install Regent (locked by uv.lock)
        if: steps.gate.outputs.enabled == 'true'
        run: uv sync --locked --extra dev

      - name: Run the eval suite live
        if: steps.gate.outputs.enabled == 'true'
        env:
          REGENT_PROVIDER: anthropic
        run: regent evals --live --report reports/evals-live.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.enabled == 'true'
        with:
          name: evals-live
          path: reports/evals-live.json
          retention-days: 90
