# =============================================================================
# Dogfooding — Regent reviews its own pull requests.
#
# Two jobs:
#   replay  Always runs. Uses the replay provider (scripted answers, no key, no
#           network to a model) and --dry-run: it proves the whole chain —
#           mandate resolution, read-only analysis, verification, the review
#           the agent *would* post — without touching the PR.
#   live    Runs only when the repository has an ANTHROPIC_API_KEY secret. It
#           posts a real, advisory review. Never approves, never blocks: the
#           mandate is L1_ADVISE.
# =============================================================================
name: Regent PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: regent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Dry run (replay provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Install Regent (locked by uv.lock)
        run: uv sync --locked

      - name: Review this PR under its mandate (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGENT_PROVIDER: replay
          REGENT_REPLAY_FILE: scripts/fixtures/pr_reviewer_replay.json
          REGENT_LEDGER: reports/ledger.jsonl
          # Event data reaches the shell through the environment, never through
          # template expansion, so it can never be parsed as code.
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          regent run pr-reviewer \
            --repo "${GITHUB_REPOSITORY}" \
            --event "pull_request.${PR_ACTION}" \
            --payload "{\"number\": ${PR_NUMBER}}" \
            --provider replay --dry-run \
            --output reports/run.json

      - name: The ledger of the run must verify
        run: regent ledger verify reports/ledger.jsonl

      - name: Publish the run in the job summary
        if: always()
        run: |
          {
            echo "## 🤖 Regent dry run — pr-reviewer"
            echo
            echo '```json'
            python -c "import json; r=json.load(open('reports/run.json')); print(json.dumps({k: r[k] for k in ('agent','status','usage','error')}, indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: regent-dry-run
          path: reports/
          retention-days: 14

  live:
    name: Live review (needs ANTHROPIC_API_KEY)
    runs-on: ubuntu-latest
    needs: [replay]
    # Secrets cannot be read in `if:` directly; route them through env.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write # post the review and labels
    steps:
      - name: Skip when no key is configured
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "no ANTHROPIC_API_KEY secret — live review skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.gate.outputs.enabled == 'true'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Install Regent (locked by uv.lock)
        if: steps.gate.outputs.enabled == 'true'
        run: uv sync --locked

      - name: Review this PR (advisory, posted as comments)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGENT_PROVIDER: anthropic
          REGENT_LEDGER: reports/ledger.jsonl
          # Event data reaches the shell through the environment, never through
          # template expansion, so it can never be parsed as code.
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          regent run pr-reviewer \
            --repo "${GITHUB_REPOSITORY}" \
            --event "pull_request.${PR_ACTION}" \
            --payload "{\"number\": ${PR_NUMBER}}" \
            --output reports/run.json || echo "::warning::the run did not succeed — see the ledger artifact"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: regent-live-review
          path: reports/
          retention-days: 30
