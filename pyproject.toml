[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regent-platform"
description = "Governed AI agents for DevOps automation — every action under an explicit mandate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Florian Martins" }]
keywords = ["devops", "aiops", "llm-agents", "platform-engineering", "devsecops", "governance", "slsa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1.0",
  "rich>=13.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=1.0,<2",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
  "regent-platform[api,otel]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "bandit[toml]>=1.7",
  "actionlint-py>=1.7",
  "pip-audit>=2.7",
  "build>=1.2",
  "twine>=5.1",
  "cloudguard-iac @ git+https://github.com/FlorianMartins/cloudguard-iac@main",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-mermaid2-plugin>=1.1",
]

[project.urls]
Homepage = "https://github.com/FlorianMartins/regent"
Repository = "https://github.com/FlorianMartins/regent"
Documentation = "https://florianmartins.github.io/regent/"
Issues = "https://github.com/FlorianMartins/regent/issues"

[project.scripts]
regent = "regent.cli.main:main"

[tool.setuptools.packages.find]
include = ["regent*"]

[tool.setuptools.package-data]
regent = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "regent.__version__" }

# ---------------------------------------------------------------------------
# Lint & format — ruff replaces flake8, isort, pyupgrade and black
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["infra", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ARG", "PTH", "RET", "D"]
ignore = [
  "D203", "D213", "D107",
  "B008",   # Typer/FastAPI declare defaults through calls, by design
  "S101",   # assert is how pytest works
  "RET504", # named result variables aid readability
  "N818",   # domain exceptions read as outcomes (MandateDenied), not as errors
  "D105",   # magic methods
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S105", "S106", "S108", "ARG001", "ARG002", "E501", "RUF059"]
"scripts/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
packages = ["regent"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["cloudguard.*", "opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  # Third-party deprecations are theirs to fix; they must not turn our build red.
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:anyio.*",
  "ignore::DeprecationWarning:httpx.*",
  "ignore:.*BlockingPortal.*:DeprecationWarning",
]
markers = ["live: needs a real LLM provider and network access (opt-in)"]

[tool.coverage.run]
source = ["regent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

# ---------------------------------------------------------------------------
# SAST on our own code
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist", "infra"]
