    "json /repos/*/pulls/42": { number: 42, title: "build(deps): bump httpx from 0.27.0 to 0.27.2", body: "", user: { login: "dependabot[bot]" }, base: { ref: main }, head: { ref: dep, sha: 1 }, changed_files: 1, additions: 1, deletions: 1, labels: [] }
    "diff /repos/*/pulls/42": "-httpx==0.27.0\n+httpx==0.27.2\n"
model:
