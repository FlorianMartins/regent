# Repository- or environment-specific overrides. More specific scopes win.
#
# Example 1 — a low-risk internal repository lets the dependency steward merge
# routine bumps on its own (the approval requirement is lifted).
- agent: dependency-steward
  scopes: ["acme/internal-tools"]
  environments: ["*"]
  autonomy: L3_ACT_REVERSIBLE
  model_tier: fast
  allowed_tools: ["github.get_pr", "github.get_pr_diff", "github.list_pr_files", "github.get_workflow_run",
                  "github.comment", "github.add_labels", "github.merge_pull_request"]
  requires_approval: []
  max_remote_class: INTERNAL
  verification: required
  budget: { max_llm_calls: 3, max_usd: 0.5, max_duration_s: 300 }

# Example 2 — production incident triage must stay fully local (RESTRICTED data),
# so the remote class is PUBLIC: anything above routes to the local provider.
- agent: incident-triage
  scopes: ["acme/payments-*"]
  environments: ["prod"]
  autonomy: L1_ADVISE
  model_tier: deep
  allowed_tools: ["metrics.query", "github.list_commits", "github.compare", "github.comment"]
  max_remote_class: PUBLIC
  verification: advisory
  budget: { max_llm_calls: 4, max_usd: 2.0, max_duration_s: 300 }

