apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regent-staging
  namespace: argocd
spec:
  project: regent
  source:
    repoURL: https://github.com/FlorianMartins/regent.git
    targetRevision: main
    path: infra/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: regent-staging
  syncPolicy:
    # staging syncs automatically but never prunes: a removed resource is reviewed first.
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
