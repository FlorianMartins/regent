# App of apps — one Application that owns the three environment Applications.
# Bootstrapping a cluster is `kubectl apply -f project.yaml -f app-of-apps.yaml`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regent-environments
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: regent
  source:
    repoURL: https://github.com/FlorianMartins/regent.git
    targetRevision: main
    path: infra/k8s/argocd
    directory:
      include: "app-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
