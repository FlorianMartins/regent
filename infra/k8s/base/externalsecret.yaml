# Secrets never live in git. External Secrets Operator pulls them from Vault
# (a ClusterSecretStore named `vault`, configured once per cluster) into a
# Kubernetes Secret the pod reads through envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: regent-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: regent-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: regent/llm
        property: anthropic_api_key
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: regent/github
        property: app_installation_token
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: regent/github
        property: webhook_secret
    - secretKey: ALERTMANAGER_WEBHOOK_TOKEN
      remoteRef:
        key: regent/alertmanager
        property: token
